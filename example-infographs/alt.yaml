# yaml-language-server: $schema=../schemas/infograph.json
# infograph.yaml
#
# Infograph MVP.
#
# Goal:
# Represent facts, experiences, decisions, constraints and their relationships
# in a human-writable graph.
#
# This file should not describe slides, reports or speaker notes.
# It describes the underlying information from which those artifacts can later
# be derived.
#
# Query profiles are intentionally not stored here.
# They should live in TypeScript code, because they are procedural strategies:
# depth limits, complexity limits, edge filtering, boundary detection, ordering.
#
# A projection/query returns:
# - active nodes: the selected presentation surface
# - active edges: relationships inside that surface
# - boundary edges: relationships from active nodes to inactive nodes
#
# Boundary edges can later become discussion openings, Q/A paths, annex material,
# or deeper explanation paths.
info:
  title: Alternance 2ème partie
  context: Apprenticeship
  author: me
domain:
  source:
    journal:
    user_stories:
    documentation:
    url:
      desc: specific url (put url in why)
  kind:
    project:
      desc: |
        A named mission, initiative or structured work area.
        Apprenticeship work is organized around missions, not only isolated tasks.
        Example: Sponsorship.
    task:
      desc: |
        A concrete task, implementation effort, investigation or sub-part of a project.
        Lets the graph represent actual work without creating one project per task.
        Example: amount calculation reconstruction, view bug fixes, workflow updates.
    product:
      desc: |
        An user-facing artifact: presentation, application, site Separates work from its outputs.
        Useful when explaining what was actually delivered.
    tool:
      desc: |
        A technical platform, software, framework or environment used in the work.
        Tracks the technical environment.
        Example: Power Automate, SharePoint, LeanKit, Jira, Confluence.
    constraint:
      desc: |
        A limitation, pressure, rule, instability or external condition that shapes the work.
        The journal contains many cases where the important fact is not what was done, but what made it difficult or shaped the available choices.
        Example: short handover, runtime errors, support restrictions, changing scope.
    event:
      desc: |
        A dated or period-bound occurrence, milestone or point in time. Events represent happenings that influence, illustrate or punctuate the chronology of the infograph.
        Some nodes are important because they happened at a specific time. Example: return from leave, demo on June 9, abandonment of a tool direction.
    decision:
      desc: |
        A choice, explicit or implicit, that changed direction or reduced uncertainty.
        Decisions explain why the work followed one path instead of another.
        Example: abandoning Confluence, returning to LeanKit, not implementing NJflow.
    learning:
      desc: |
        A skill, constraint, progression axis or change in judgment.
        Evidence of progression. Example: moving from implementation to reliability reasoning.
    actor:
      desc: |
        A person, team, support group or institution involved in the situation.
        Some constraints and decisions are organizational. 
        Provide name, function and position relative to the author.
        Keeping actors explicit avoids hiding social/project context in prose.
        Example: IUT, support team, Indian team, project owner, Mahmoud, Fabrice.
    jargon:
      desc: |
        A named technical term, expression or shorthand used within this corpus to refer to a recurring concept.
        Use it when introducing vocabulary that deserves its own identity and can be referenced by multiple graph elements.
        It acts as a shared designation rather than as a project, tool or process.
        Example: `maker_compiler` refers to the observed distinction between Power Platform maker-time and runtime behavior.
    process:
      desc: |
        An executable recipe for actions actors with visibility rules over time.
        Example: request analysis
    problem:
      desc: |
        An unsatisfactory existing state, gap, deficiency or recurring issue that justifies intervention.
        Use it to represent what is wrong or missing before a solution is introduced, rather than a limitation imposed on that solution.
        Example: The informal processing of sponsorship requests creates a lack of traceability and visibility.
    objective:
      desc: |
        A desired future state or outcome that a project, actor or organization seeks to achieve.
        Use it when the intended result has an identity of its own, may evolve over time, or receives contributions from several projects, tasks or methods.
        Example: Centralized visibility into sponsorship funding is an objective of the Sponsorship project.
    challenge:
      desc: |
        A difficulty that makes an objective, task or project harder to accomplish.
        Use it for expected or encountered difficulties that require a deliberate response, rather than for an unsatisfactory state in the existing environment.
        Example: Reliably testing Power Automate flows is a challenge because much of their behavior depends on remote services and runtime configuration.
    method:
      desc: |
        A reusable approach, technique, pattern or disciplined way of performing work.
        Use it to represent how work is carried out when the approach can be explained, reused or applied independently of a single task.
        It differs from a process, which represents a sequence of business or system activities.
        Example: Fixture-based flow testing is a method for testing Power Automate flows against controlled SharePoint data.
    '-':
      desc: Free-form fallback for information that does not fit the graph cleanly yet. Prevents schema pressure. If something is important but hard to model, it can enter the graph first and be structured later.
  verb:
    contains:
      desc: |
        The source includes the target as a sub-part.
        Basic structure relation. Analogy: UML composition. The target is only relevant within the source.
        Example: Sponsorship contains amount calculation work.
    uses:
      desc: |
        The source uses the target as a tool, platform, method or resource.
        Essential for technical environment projections. Analogy: UML agregation.
        Example: Sponsorship uses Power Automate.
    produces:
      desc: |
        The source creates, modifies or results in the target.
        Connects work to concrete outputs.
        Example: work item produces demo artifact.
    requires:
      desc: |
        Understanding, completing or validating the source requires the target.
        Captures hidden depth. These edges often become discussion openings when outside the active surface.
    explains:
      desc: |
        The source explains, triggers or makes the target more likely.
        Captures chronology and causality without writing a full narrative.
    illustrates:
      desc: |
        The source is an example of the target.
        Lets concrete events support broader claims. Example: handover pressure illustrates autonomy growth.
    constrains:
      desc: |
        The source limits, shapes, pressures or hinders the target.
        The journal repeatedly describes work shaped by tool limits, support constraints, planning pressure and changing scope.
    prevents:
      desc: |
        Useful for representing tradeoffs. Example: limited available team capacity prevents additional staffing.
        The source prevents the target.
    replaces:
      desc: |
        The source takes the place of the target.
        Useful for project direction changes.
        Example: LeanKit replaces Jira in the chosen workflow direction.
    involves:
      desc: |
        The source inherently involves the target as a stakeholder, contributor or responsible party.
        Describes structural or organizational participation rather than a single occurrence.
        Target's perspective, input, actions or constraints are part of the situation.
        Example: Sponsorship involves Antoine.
    participates:
      desc: |
        The source takes part in the target.
        Describes participation from the participant's point of view, without implying ownership or responsibility.
        Useful for actors participating in projects, events, processes or tasks.
        Example: Antoine participates in the June 9 demo.
    anticipates:
      desc: |
        The source is created, chosen or performed in preparation for the target.
        Use it when an action, method, decision or tool addresses a difficulty, event or condition before it fully occurs.
        It does not imply that the target is completely prevented.
        Example: Migrating connections to environment variables anticipates production deployment.
    systematizes:
      desc: |
        The source turns the target into a more explicit, repeatable, organized or verifiable practice.
        Use it when something is made systematic without necessarily being fully automated.
        Example: The Sponsorship application systematizes the instruction of sponsorship requests.
    contributes:
      desc: |
        The source partially helps produce, achieve or shape the target.
        Use it for causal or enabling relationships where the source matters but does not fully explain or determine the target.
        Prefer a more precise verb such as `explains`, `produces` or `prevents` when that stronger relationship is justified.
        Example: Unit-testing methods contribute to the reliability objective.
    '-':
      desc: |
        Weak fallback relation when a connection matters but is not yet precise.
        Prevents premature modeling. Better to store an imperfect relation than to lose the connection.
# Stable keys. Edges need stable references. Keys: /${kind} [-_a-z ]+/. The kind is part of the node key identity, and always provided in references. So "project sponsorship" and "tool sponsorship" are different nodes.
# The key should not depend on the exact wording of the title.
nodes:
  # Node category.
  # Queries may treat projects, tools, constraints, decisions and learnings
  # differently without needing complex inference.
  actor me:
    info:
      title: Me
      summary: The apprentice whose work, reasoning and experience form the main perspective of the infograph.
      claim:
        - fact: I carried out apprenticeship work represented in this public example infograph.
        - opinion: I care strongly about work that remains understandable after project scope and tooling constraints grow.
      complexity:
        is: simple
        why: The author perspective is central to the graph and should be explicit.
      tag:
        - people
    participates:
      project sponsorship:
        with:
          complexity:
            is: simple
            why: I directly worked on the project over the apprenticeship period.
          claim:
            - fact: I participated in the Sponsorship project as one of my main apprenticeship missions.
      event quarterly_meeting:
        with:
          complexity:
            is: simple
            why: Attending the meeting is a direct participation relation, without implying responsibility for the event.
          claim:
            - fact: I attended the quarterly meeting.
  project sponsorship:
    info:
      title: Sponsorship
      summary: Business project involving sponsorship-related workflows, follow-up, data handling and automation.
      claim:
        - fact: I worked on Sponsorship as one of the main active missions of the apprenticeship.
        - fact: The project evolves over time instead of remaining a fixed implementation task.
        - hypothesis: The project may have evolved partly because its initial framing did not expose all operational constraints.
        - opinion: I see the project as a useful example for presenting progression during the apprenticeship.
        - counterfactual: With a more stable initial scope, less work would have been needed to reconstruct context later.
      date:
        from: 2025-12
        to: 2026-07
      importance:
        is: central
        why: Major project, agregating many learning, strategic opportunities, and catalyzing personal growth.
      complexity:
        is: natural
        why: The purpose of the application and the main features of the sponsorship analysis and approval flow is natural to explain.
      source:
        is: journal
        why: (refer to main entries about the project one by one)
      tag:
        - sponsorship
        - business_workflow
        - automation
    # Outgoing edges.
    involves:
      actor me:
        with:
          complexity:
            is: simple
            why: My involvement in the project is direct and easy to state.
          claim:
            - fact: I was the main implementer and context reconstructor for the sponsorship work.
    uses:
      tool power_automate:
        # provides additional edge information.
        with:
          # Some relationships are harder to explain than the things they connect.
          complexity:
            is: natural
            why: Power Automate usage evolves throughout the project, changing from a pure authoring to a partially generated surface due to the need for reliabilty guarantees provided by tooling.
          claim:
            - fact: I used Power Automate to implement automation aspects of Sponsorship.
        # no info, so power_automate must exist at a level above
      tool sharepoint:
        with:
          complexity:
            is: simple
            why: SharePoint is used as a database; repeatable provisioning challenges remain unsolved
          claim:
            - fact: SharePoint was part of the project environment.
    contains:
      # the node is understood as belonging to the scope of this particular node. In display, we will show something like Sponsorship: Application. The id becomes project sponsorship > product application. This is what allows us to use broad names in context.
      product application:
        with:
          complexity:
            is: simple
            why: Belonging of the application to the Sponsorship scope is obvious.
          claim:
            - fact: I worked on an application that was not initially part of the need.
        info:
          title: Application
          summary: The application serves as a front-end for the product.
          complexity:
            is: simple
            why: The application is a straightforward front-end; its role is easy to state.
          claim: # these should be edges but you get the point.
            - fact: Since it was added, SharePoint is fully treated as a database layer
            - fact: I used a dedicated front-end to simplify part of the interaction with the underlying data and workflow.
        involves:
          actor me:
            with:
              complexity:
                is: simple
                why: I worked directly on the application.
              claim:
                - fact: I contributed directly to the Sponsorship application.
      process amount_calculation:
        with:
          complexity:
            is: contextual
            why: The process includes a rolling time window and has evolved
          claim:
            - fact: I had to understand amount calculation behavior to improve Sponsorship reliability.
        info:
          title: Amount calculation
          summary: Business calculation logic that requires reconstruction, understanding and reliable handling.
          importance:
            is: central
            why: The amount calculation is one of the core reliability risks in the Sponsorship work.
          complexity:
            is: intertwined
            why: Explaining it requires business rules, date windows, edge cases, and implementation context.
          source:
            - is: journal
              why: Journal entries describe the reconstruction and reliability work around this process.
            - is: user_stories
              why: User stories provide business expectations for the calculation behavior.
          claim:
            - fact: The calculation logic is difficult to understand without sufficient context.
            - fact: A short handover is not enough to fully absorb the calculation behavior.
            - fact: I worked on reliability by reconstructing edge cases and implicit rules.
          date:
            from: 2026-05
            to: 2026-07
          tag:
            - calculation
            - business_rules
            - reliability
            - edge_cases
        requires:
          constraint reliability_focus:
            with:
              complexity:
                is: natural
                why: The dependency on reliability work is clear once the calculation risks are known.
        involves:
          actor me:
            with:
              complexity:
                is: natural
                why: My reconstruction work is part of why this process matters in the graph.
              claim:
                - fact: I reconstructed part of the calculation behavior from available context, artifacts and project discussions.
  tool power_automate:
    info:
      title: Power Automate
      summary: Main automation platform used in the project, with significant practical constraints around reliability, debugging and maintainability.
      importance:
        is: central
        why: Main, "default" automation and business logic execution substrate for Studio projects.
      complexity:
        is: simple
        why: The basics and general information are simple. Advanced features are more complex to explain.
      claim:
        - fact: I used Power Automate as a central implementation platform.
        - fact: The platform introduces recurring reliability and maintainability concerns.
        - fact: Some issues are difficult to prevent because errors often appear at runtime.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - low_code
        - reliability
        - runtime_errors
    requires:
      constraint reliability_focus:
        with:
          complexity:
            is: natural
            why: The concept is clear, the implementation is less clear
          claim:
            - fact: Power Automate constraints and pitfalls made reliability and maintainability more important in my work.
  tool sharepoint:
    info:
      title: SharePoint
      summary: Data and collaboration platform used as part of the business workflow and automation environment.
      importance:
        is: major
        why: Main database tool, used by the Studio for persistence and business data retention.
      complexity:
        is: natural
        why: SharePoint is widely known and used.
      claim:
        - fact: SharePoint is part of the technical environment.
        - fact: I had to account for how the structure of stored data affects automation behavior.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - sharepoint
        - data
        - collaboration
  constraint evolving_scope:
    info:
      title: Evolving project scope
      summary: The project changes over time, which affected planning, understanding and implementation priorities.
      importance:
        is: central
        why: Changes increase workload and risk, thereby requiring more tools to protect reliability.
      complexity:
        is: natural
        why: Many project evolved
      source:
        - is: journal
          why: (reference main related entry dates here)
        - is: journal
          why: (reference main related entry dates here)
      claim:
        - fact: The project does not remain stable from its initial framing.
        - fact: New expectations and constraints appear as the work progresses.
        - fact: The evolution of the project increased my need to rebuild context.
        - fact: The project is a moving system; increasing the number of parts increases complexity nonlinearily.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - scope
        - planning
        - project_management
    explains:
      event handover_pressure:
        with:
          complexity:
            is: natural
            why: The transition are simple officially, however there are remaining concerns and unanswered questions in practice
          claim:
            - fact: The changing project scope made my short handover harder.
    constrains:
      project sponsorship:
        with:
          complexity:
            is: natural
            why: The evolving scope affected how the Sponsorship work had to be understood and presented.
    involves:
      actor me:
        with:
          complexity:
            is: natural
            why: My planning and context reconstruction were directly shaped by the evolving scope.
          claim:
            - fact: I had to adapt my understanding and work priorities as the project scope changed.
  constraint reliability_focus:
    info:
      title: Reliability focus
      summary: The work shifts from simply making automations work to making them understandable, maintainable and reliable.
      importance:
        is: central
        why: Prototypes need to work. Product need to work twice. Uncertainty reduction is a major part of my work.
      complexity:
        is: intertwined
        why: Relates to every project contextually, depending on stack, Power Platform pitfalls, and hidden semantics.
      source:
        is: journal
        why: Main focus, pretty much from the very first day
      claim:
        - fact: A working automation is not sufficient by itself.
        - fact: I had to pay attention to maintainability, traceability and edge cases.
        - fact: Reliability became a major learning axis of my apprenticeship.
      date:
        from: 2026-04
        to: 2026-07
      tag:
        - reliability
        - maintainability
        - learning
        - automation
    requires:
      learning autonomy_growth:
        with:
          complexity:
            is: natural
            why: Required overview of the system; still simple to explain
          claim:
            - fact: Working on reliability required more independent judgment from me.
    involves:
      actor me:
        with:
          complexity:
            is: natural
            why: This learning axis describes my work and judgment, not only an external project property.
          claim:
            - fact: I worked on making automations more understandable, maintainable and reliable.
  event handover_pressure:
    info:
      title: Handover under time pressure
      summary: A short handover period makes it difficult to reconstruct the full context of an evolved project.
      importance:
        is: major
        why: Changes the mission of the DSI Studio and my future opportunities.
      complexity:
        is: contextual
        why: Affects every project differently
      source:
        - is: journal
          why: (reference main related entry dates here)
        - is: journal
          why: (reference main related entry dates here)
      claim:
        - fact: A limited handover period is not enough to fully understand the evolved project.
        - fact: I had to reconstruct context from existing artifacts and behavior during the handover situation.
      date:
        from: 2026-06
        to: 2026-06
      tag:
        - handover
        - context
        - planning
    involves:
      actor me:
        with:
          complexity:
            is: simple
            why: I was directly subject to the handover pressure.
          claim:
            - fact: I had to reconstruct project context from artifacts and meetings.
            - fact: I experienced the time pressure materially during handover.
      actor indian_power_platform_team:
        with:
          complexity:
            is: natural
            why: Explaining the team's role needs a little context about the transition.
          claim:
            - fact: Receives transferred project responsibilities after the transition.
    illustrates:
      learning autonomy_growth:
        with:
          complexity:
            is: natural
            why: Prepared of Knowledge Transfers by myself, "surprise English" meetings over lunchtime, little official information
          claim:
            - fact: The handover situation illustrates why I needed to reconstruct context autonomously.
  learning autonomy_growth:
    info:
      title: Autonomy growth
      summary: Progression from executing tasks toward reconstructing context, identifying risks, and reasoning about reliability.
      importance:
        is: central
        why: Concerns almost every project.
      complexity:
        is: contextual
        why: Autonomy applies differently from project to project.
      source:
        - is: journal
          why: distributed
        - is: journal
          why: (you could refer an entry with a specific major instance of autonomy here)
      claim:
        - fact: My apprenticeship required increasing autonomy over time.
        - fact: I had to understand unclear systems, not only implement requested changes.
        - fact: I developed stronger judgment around complexity and reliability.
      date:
        from: 2026-01
        to: 2026-07
      tag:
        - autonomy
        - learning
        - progression
    involves:
      actor me:
        with:
          complexity:
            is: simple
            why: This node describes my progression.
          claim:
            - fact: I am the actor whose autonomy growth is represented by this node.
  event quarterly_meeting:
    info:
      title: Quarterly Meeting
      summary: The DSI's quarterly meeting. News about the organization, project presentations, cybersecurity metrics, client NPS.
      importance:
        is: useful
        why: it brings some long awaited context and direction after the Indian transition
      complexity:
        is: natural
        why: it doesn't directly affect ongoing projects. it is a scheduled event.
      source:
        - is: journal
          why: entry 2026-06-26
      claim:
        - fact: The meeting covers the finaliaztion the transition of projects to the Indian Power Platform development team
        - fact: Fabrice's secondborn daughter # elements not directly related to the work are to be included as well! while some may seem unrelated, they can bring additional context. The point is to represent all information, not just what you believe relevant right now.
        - fact: The meeting covers the future role of the DSI after the Indian team takes over Power Platform and SharePoint developments
      date: 2026-06-26 # A lone date is supported (it is parsed to equal from/to) for punctual events
  # Actors are ordinary nodes, linked to the situations they take part in with the `involves` verb.
  actor indian_power_platform_team:
    info:
      title: Indian Power Platform team
      summary: Team receiving transferred Power Platform and SharePoint project responsibilities after the transition.
      complexity:
        is: natural
        why: The team's role only makes sense alongside the transition context.
      tag:
        - people
# Edges. key format: `${source key} ${verb} ${target key}`
# Use for edges that don't belong to any particular node.
edges:
  # The source node uses or relies on the target node as a tool, platform,
  # method or resource.
  # all edges are keyed by (source key, verb, target key)
  learning autonomy_growth - event handover_pressure:
    complexity:
      is: natural
      why: The link between autonomy and the handover is intuitive but benefits from a sentence of context.
    claim:
      - fact: These two nodes are related somehow
