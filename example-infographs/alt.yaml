# yaml-language-server: $schema=../schemas/infograph.json
# infograph.yaml
#
# Infograph MVP.
#
# Goal:
# Represent facts, experiences, decisions, constraints and their relationships
# in a human-writable graph.
#
# This file should not describe slides, reports or speaker notes.
# It describes the underlying information from which those artifacts can later
# be derived.
#
# Query profiles are intentionally not stored here.
# They should live in TypeScript code, because they are procedural strategies:
# depth limits, complexity limits, edge filtering, boundary detection, ordering.
#
# A projection/query returns:
# - active nodes: the selected presentation surface
# - active edges: relationships inside that surface
# - boundary edges: relationships from active nodes to inactive nodes
#
# Boundary edges can later become discussion openings, Q/A paths, annex material,
# or deeper explanation paths.
info:
  title: Alternance 2ème partie
  context: ENGIE apprenticeship
  author: me
domain:
  source:
    journal:
    user stories:
    documentation:
    url:
      desc: specific url (put url in why)

  kind:
    project:
      desc: |
        A named mission, initiative or structured work area.
        Apprenticeship work is organized around missions, not only isolated tasks.
        Example: Sponsorship.
    task:
      desc: |
        A concrete task, implementation effort, investigation or sub-part of a project.
        Lets the graph represent actual work without creating one project per task.
        Example: amount calculation reconstruction, view bug fixes, workflow updates.
    product:
      desc: |
        An user-facing artifact: presentation, application, site Separates work from its outputs.
        Useful when explaining what was actually delivered.
    tool:
      desc: |
        A technical platform, software, framework or environment used in the work.
        Tracks the technical environment.
        Example: Power Automate, SharePoint, LeanKit, Jira, Confluence.
    constraint:
      desc: |
        A limitation, pressure, rule, instability or external condition that shapes the work.
        The journal contains many cases where the important fact is not what was done, but what made it difficult or shaped the available choices.
        Example: short handover, runtime errors, support restrictions, changing scope.
    event:
      desc: |
        A dated or period-bound occurrence that changed the situation.
        Some nodes are important because they happened at a specific time. Example: return from leave, demo on June 9, abandonment of a tool direction.
    decision:
      desc: |
        A choice, explicit or implicit, that changed direction or reduced uncertainty.
        Decisions explain why the work followed one path instead of another.
        Example: abandoning Confluence, returning to LeanKit, not implementing NJflow.
    learning:
      desc: |
        A skill, constraint, progression axis or change in judgment.
        Evidence of progression. Example: moving from implementation to reliability reasoning.
    actor:
      desc: |
        A person, team, support group or institution involved in the situation.
        Some constraints and decisions are organizational. Keeping actors explicit avoids hiding social/project context in prose.
        Example: IUT, support team, Indian team, project owner, Mahmoud, Fabrice.
    jargon:
      desc: |
        A domain-specific term.
        Example: cumulated amount
    process:
      desc: |
        An executable recipe for actions actors with visibility rules over time.
        Example: request analysis
    '-':
      desc: Free-form fallback for information that does not fit the graph cleanly yet.
        Prevents schema pressure. If something is important but hard to model, it can enter the graph first and be structured later.
  verb:
    contains:
      desc: |
        The source includes the target as a sub-part.
        Basic structure relation. Analogy: UML composition. The target is only relevant within the source.
        Example: Sponsorship contains amount calculation work.
    uses:
      desc: |
        The source uses the target as a tool, platform, method or resource.
        Essential for technical environment projections. Analogy: UML agregation.
        Example: Sponsorship uses Power Automate.
    produces:
      desc: |
        The source creates, modifies or results in the target.
        Connects work to concrete outputs.
        Example: work item produces demo artifact.
    requires:
      desc: |
        Understanding, completing or validating the source requires the target.
        Captures hidden depth. These edges often become discussion openings when outside the active surface.
    explains:
      desc: |
        The source explains, triggers or makes the target more likely.
        Captures chronology and causality without writing a full narrative.
    illustrates:
      desc: |
        The source is an example of the target.
        Lets concrete events support broader claims. Example: handover pressure illustrates autonomy growth.
    constrains:
      desc: |
        The source limits, shapes, pressures or hinders the target.
        The journal repeatedly describes work shaped by tool limits, support constraints, planning pressure and changing scope.
    prevents:
      desc: |
        Useful for representing tradeoffs. Example: limited available team capacity prevents additional staffing.
        The source prevents the target
    replaces:
      desc: |
        The source takes the place of the target.
        Useful for project direction changes.
        Example: LeanKit replaces Jira in the chosen workflow direction.
    '-':
      desc: |
        Weak fallback relation when a connection matters but is not yet precise.
        Prevents premature modeling. Better to store an imperfect relation than to lose the connection.
# Stable keys. Edges need stable references. Keys: /${kind} [-_a-z ]+/. The kind is part of the node key identity, and always provided in references. So "project sponsorship" and "tool sponsorship" are different nodes.
# The key should not depend on the exact wording of the title.
nodes:
  # Node category.
  # Queries may treat projects, tools, constraints, decisions and learnings
  # differently without needing complex inference.
  project sponsorship:
    info:
      title: Sponsorship
      summary: Business project involving sponsorship-related workflows, follow-up, data handling and automation.
      fact:
        - The project becomes one of the main active missions of the apprenticeship.
        - The project evolves over time instead of remaining a fixed implementation task.
      date:
        from: 2025-12
        to: 2026-07
      importance:
        is: central
        why: Major project, agregating many learning, strategic opportunities, and catalyzing personal growth.
      complexity:
        is: natural
        why: The purpose of the application and the main features of the sponsorship analysis and approval flow is natural to explain.
      source:
        is: journal
        why: (refer to main entries about the project one by one)
      tag:
        - sponsorship
        - business workflow
        - automation
    # Outgoing edges.
    uses:
      tool power_automate:
        # provides additional edge information.
        with:
          # Some relationships are harder to explain than the things they connect.
          complexity:
            is: natural
            why: Power Automate usage evolves throughout the project, changing from a pure authoring to a partially generated surface due to the need for reliabilty guarantees provided by tooling.
          fact: Power Automate was used to implement automation aspects of Sponsorship.
        # no info, so power_automate must exist at a level above
      tool sharepoint:
        with:
          complexity:
            is: simple
            why: SharePoint is used as a database; repeatable provisioning challenges remain unsolved
          fact: SharePoint was part of the project environment.
    contains:
      # the node is understood as belonging to the scope of this particualar node. In display, we will show something like Sponsorship: Application. The id becomes project sponsorship > product application. This is what allows us to use broad names in context.
      product application:
        with:
          fact: Having an application was not initially part of the need.
        info:
          title: Application
          summary: The application serves as a front-end for the product.
          fact: # these should be edges but you get the point.
            - Since it was added, SharePoint is fully treated as a database layer
            - Having a dedicated front-end helped simplify
      process amount_calculation:
        with:
          complexity:
            is: contextual
            why: The process includes a rolling time window and has evolved
          fact: Sponsorship reliability depends partly on understanding amount calculation behavior.
        info:
          title: Amount calculation
          summary: Business calculation logic that requires reconstruction, understanding and reliable handling.
          importance: central
          complexity: intertwined
          source:
            - journal
            - user stories
          fact:
            - The calculation logic is difficult to understand without sufficient context.
            - A short handover is not enough to fully absorb the calculation behavior.
            - Reliability depended on understanding edge cases and implicit rules.
          date:
            from: 2026-05
            to: 2026-07
          tag:
            - calculation
            - business-rules
            - reliability
            - edge-cases
        requires:
          constraint reliability_focus:
  tool power_automate:
    info:
      title: Power Automate
      summary: Main automation platform used in the project, with significant practical constraints around reliability, debugging and maintainability.
      importance:
        is: central
        why: Main, "default" automation and business logic execution substrate for Studio projects.
      complexity:
        is: simple
        why: The basics and general information are simple. Advanced features are more complex to explain.
      fact:
        - Power Automate is central to the implementation work.
        - The platform introduces recurring reliability and maintainability concerns.
        - Some issues are difficult to prevent because errors often appear at runtime.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - power automate
        - low-code
        - reliability
        - runtime-errors
    requires:
      constraint reliability_focus:
        with:
          complexity:
            is: natural
            why: The concept is clear, the implementation is less clear
          fact: Power Automate constraints and pitfalls make reliability and maintainability more important.
  tool sharepoint:
    info:
      title: SharePoint
      summary: Data and collaboration platform used as part of the business workflow and automation environment.
      importance:
        is: major
        why: Main database tool, used by the Studio for persistence and business data retention.
      complexity:
        is: natural
        why: SharePoint is widely known and used.
      fact:
        - SharePoint is part of the technical environment.
        - The structure of stored data affects automation behavior.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - sharepoint
        - data
        - collaboration
  constraint evolving_scope:
    info:
      title: Evolving project scope
      summary: The project changes over time, which affected planning, understanding and implementation priorities.
      importance:
        is: central
        why: Changes increase workload and risk, thereby requiring more tools to protect reliability.
      complexity:
        is: natural
        why: Many project evolved
      source:
        - is: journal
          why: (reference main related entry dates here)
        - is: journal
          why: (reference main related entry dates here)
      fact:
        - The project does not remain stable from its initial framing.
        - New expectations and constraints appear as the work progresses.
        - The evolution of the project increases the need for context rebuilding.
        - The project is a moving system; increasing the number of parts increases complexity nonlinearily.
      date:
        from: 2025-12
        to: 2026-07
      tag:
        - scope
        - planning
        - project management
    explains:
      event handover_pressure:
        with:
          complexity:
            is: natural
            why: The transition are simple officially, however there are remaining concerns and unanswered questions in practice
          fact: A changing project made short handover harder.
    constrains:
      project sponsorship:
        with:
          complexity:
            is: natural
            why: The evolving scope affected how the Sponsorship work had to be understood and presented.
  constraint reliability_focus:
    info:
      title: Reliability focus
      summary: The work shifts from simply making automations work to making them understandable, maintainable and reliable.
      importance:
        is: central
        why: Prototypes need to work. Product need to work twice. Uncertainty reduction is a major part of my work.
      complexity:
        is: intertwined
        why: Relates to every project contextually, depending on stack, Power Platform pitfalls, and hidden semantics.
      source:
        is: journal
        why: Main focus, pretty much from the very first day
      fact:
        - A working automation is not sufficient by itself.
        - The project requires attention to maintainability, traceability and edge cases.
        - This becomes a major learning axis of the apprenticeship.
      date:
        from: 2026-04
        to: 2026-07
      tag:
        - reliability
        - maintainability
        - learning
        - automation
    requires:
      learning autonomy_growth:
        with:
          complexity:
            is: natural
            why: Required overview of the system; still simple to explain
          fact: Working on reliability requirsd more independent judgment.
  event handover_pressure:
    info:
      title: Handover under time pressure
      summary: A short handover period makes it difficult to reconstruct the full context of an evolved project.
      importance:
        is: major
        why: Changes the mission of the DSI Studio and my future opportunities.
      complexity:
        is: contextual
        why: Affects every project differently
      source:
        - is: journal
          why: (reference main related entry dates here)
        - is: journal
          why: (reference main related entry dates here)
      fact:
        - A limited handover period is not enough to fully understand the evolved project.
        - The situation increases the need to reconstruct context from existing artifacts and behavior.
      date:
        from: 2026-06
        to: 2026-06
      tag:
        - handover
        - context
        - planning
    illustrates:
      learning autonomy_growth:
        with:
          complexity:
            is: natural
            why: Prepared of Knowledge Transfers by myself, "surprise English" meetings over lunchtime, little official information
          fact: The handover situation illustrates the need to reconstruct context autonomously.
  learning autonomy_growth:
    info:
      title: Autonomy growth
      summary: Progression from executing tasks toward reconstructing context, identifying risks, and reasoning about reliability.
      importance:
        is: central
        why: Concerns almost every project.
      complexity:
        is: contextual
        why: Autonomy applies differently from project to project.
      source:
        is: journal
        why: distributed
      fact:
        - The apprenticeship requires increasing autonomy over time.
        - Autonomy involves understanding unclear systems, not only implementing requested changes.
        - The work develops stronger judgment around complexity and reliability.
      date:
        from: 2026-01
        to: 2026-07
      tag:
        - autonomy
        - learning
        - progression
  event quarterly_meeting:
    info:
      title: Quarterly Meeting
      summary: The DSI's quarterly meeting. News about the organization, project presentations, cybersecurity metrics, client NPS.
      importance:
        is: useful
        why: it brings some long awaited context and direction after the Indian transition
      complexity:
        is: natural
        why: it doesn't directly affect ongoing projects. it is a scheduled event.
      source:
        - is: journal
          why: entry 2026-06-26
      fact:
        - Covers the finaliaztion the transition of projects to the Indian Power Platform development team
        - Fabrice's secondborn daughter # elements not directly related to the work are to be included as well! while some may seem unrelated, they can bring additional context. The point is to represent all information, not just what you believe relevant right now.
        - Future role of the DSI after the Indian team takes over Power Platform and SharePoint developments
      date: 2026-06-26 # A lone date is supported (it is parsed to equal from/to) for punctual events
# Edges. key format: `${source key} ${verb} ${target key}`
# Use for edges that don't belong to any particular node.
edges:
  # The source node uses or relies on the target node as a tool, platform,
  # method or resource.
  # all edges are keyed by (source key, verb, target key)
  learning autonomy_growth - event handover_pressure:
    fact: These two nodes are related somehow
